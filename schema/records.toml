  { name = "argv",     max = 1024, doc = "mm->arg_start..arg_end read with bpf_copy_from_user_task, NUL-separated; the same cap as EXEC's argv" },
]

[[record]]
name = "SNAP_DONE"
type = 38
version = 1
class = "MARKER"
doc = "The books of one process snapshot, written right after its PROC records. They close: tasks = threads + emitted + write_failed (the BPF side) and emitted = entries + invalid + unwritten (p15d's side); a reader that finds them open marks the run INVALID. A closing snapshot's SNAP_DONE precedes END (ADR-0023 rule 1)."
fields = [
  { name = "duration_ns",    c = "u64", doc = "CLOCK_BOOTTIME from creating the iterator to its end of output" },
  { name = "tasks",          c = "u64", doc = "tasks the iterator showed the program (every thread of every process)" },
  { name = "threads",        c = "u64", doc = "tasks that are not a thread-group leader: not recorded, by design (a PROC is one thread group)" },
  { name = "emitted",        c = "u64", doc = "PROC records the program wrote to the iterator's output" },
  { name = "write_failed",   c = "u64", doc = "bpf_seq_write refused a record: that process is missing from the snapshot (run INVALID)" },
  { name = "entries",        c = "u64", doc = "PROC records that passed p15_rec_check and went into the WAL" },
  { name = "invalid",        c = "u64", doc = "output that failed p15_rec_check or did not frame as records: counted, never written (run INVALID)" },
  { name = "unwritten",      c = "u64", doc = "checked PROC records the WAL refused (an I/O failure; the run is already INVALID)" },
  { name = "kthreads",       c = "u64", doc = "entries that are kernel threads (no argv, no executable)" },
  { name = "exiting",        c = "u64", doc = "entries already exiting, without an mm (no argv, no executable): not read failures" },
  { name = "argv_failed",    c = "u64", doc = "entries whose argv could not be read (bpf_copy_from_user_task failed): P15_F_READ_FAILED" },
  { name = "path_unlocked",  c = "u64", doc = "entries whose executable path was not read because the task's mmap lock was busy or the iterator could not start: P15_F_READ_FAILED" },
  { name = "path_not_found", c = "u64", doc = "entries whose mapping at mm->start_code is not mm->exe_file, so the path is not read: P15_F_READ_FAILED" },
  { name = "path_failed",    c = "u64", doc = "entries where bpf_d_path failed for another reason than length: P15_F_READ_FAILED" },
  { name = "truncated",      c = "u64", doc = "fields cut: an argv longer than its maximum, or a path longer than its maximum (a record with both counts twice); each such entry has P15_F_TRUNCATED" },
  { name = "snap_id",        c = "u32", doc = "as in PROC" },
  { name = "error",          c = "i32", doc = "0, or the negative errno that ended reading the iterator early (then the snapshot is incomplete and the run INVALID)" },
  { name = "kind",           c = "u16", doc = "as in PROC" },
]

[[record]]
name = "SNAP_DONE"
type = 38
version = 2
class = "MARKER"
doc = "The books of one process snapshot, written after its PROC records and, with file identity, its FD records (ADR-0015 rule 7). The PROC books are v1's; the fd_* books close: fd_files = fd_no_inode + fd_emitted + fd_write_failed (the BPF side), fd_emitted = fd_entries + fd_invalid + fd_unwritten (p15d's side) and fd_emitted = fd_known + fd_registered + fd_map_full; a lost FD row or a failed read makes the snapshot incomplete and the run INVALID, as for PROC. v1's text follows: They close: tasks = threads + emitted + write_failed (the BPF side) and emitted = entries + invalid + unwritten (p15d's side); a reader that finds them open marks the run INVALID. A closing snapshot's SNAP_DONE precedes END (ADR-0023 rule 1)."
