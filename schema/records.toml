type = 33
version = 2
class = "STATS"
doc = "The capture's own health, every stats interval (1 s by default), and once more at the end of the run (ADR-0019 G4.1). v2 adds the events the kernel skipped (ADR-0020). Spine counters are the BPF per-cause counters summed over CPUs (ADR-0006 rule 6)."
