  { name = "gap_records",           c = "u64", doc = "GAP records the drain emitted, cumulative (ADR-0017 layer 4)" },
  # the drain's timing (ADR-0017 layers 2, 3 and 5; ADR-0019 G4.1 'poll-to-poll gap as a fixed histogram')
  { name = "poll_gap_le_100us",     c = "u64", doc = "drain polls that came at most 100 us after the previous one, cumulative" },
  { name = "poll_gap_le_1ms",       c = "u64", doc = "polls 100 us to 1 ms after the previous one, cumulative" },
  { name = "poll_gap_le_10ms",      c = "u64", doc = "polls 1 to 10 ms after, cumulative" },
