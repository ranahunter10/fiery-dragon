# SPDX-License-Identifier: MIT
#
# Fiery Dragon record schema: the single source of truth for every record
# layout (ADR-0008). Generated from this file, never edited by hand:
#   schema/generated/p15_records.h          C structs + static asserts (BPF and daemon)
#   schema/generated/p15_records.py         numpy dtypes (analysis tier)
#   schema/generated/RECORDS.md             reference
#   schema/generated/p15_layout_probe.bpf.c BTF probe for the three-way layout check
# Regenerate: python3 schema/gen/gen.py      Check: python3 schema/gen/gen.py --check
#
# Rules the generator enforces:
#  - fields are laid out in the order written, with natural alignment and NO implicit
#    padding: a misaligned field is an error (add an explicit pad field);
#  - each variable-length field ("var") gets generated metadata in the fixed part:
#    <name>_full (u32, full length; P15_LEN_UNKNOWN if not known) and <name>_len
#    (u16, bytes copied); its bytes follow the fixed part, in the order declared;
#  - the fixed part is padded to 8 bytes; a whole record is padded to 8 bytes;
#  - changing a (type, version) layout needs a version bump (schema/lock.json).
#  - a [[part]] is a header-less struct (size a multiple of 8) that a var field may carry with
#    `part = "<NAME>"`: the field is then absent (0 bytes) or that struct whole; part fields come
#    before byte fields, so each starts 8-aligned; a part's layout is locked like a record's;
#  - [[fflag]] names a bit (0..31) of the u32 `fflags` field some records have (P15_FF_<NAME>).

[header]
doc = "Common header of every record, 32 bytes (ADR-0008)."
fields = [
  { name = "type",     c = "u16", doc = "record type (the [[record]] type number)" },
  { name = "version",  c = "u16", doc = "layout version of that type" },
  { name = "len",      c = "u16", doc = "total record length in bytes, header and variable tails included, padded to 8" },
  { name = "flags",    c = "u16", doc = "P15_F_* flags" },
  { name = "ts_ns",    c = "u64", doc = "event time, CLOCK_BOOTTIME ns (bpf_ktime_get_boot_ns)" },
  { name = "tgid",     c = "u32", doc = "thread-group id, init pid namespace (ADR-0009)" },
  { name = "tid",      c = "u32", doc = "thread id, init pid namespace" },
  { name = "start_ns", c = "u64", doc = "group_leader->start_boottime: with tgid and the segment's boot_id, the process identity (ADR-0009)" },
]

[[flag]]
name = "TRUNCATED"
bit = 0
doc = "at least one variable-length field was cut at its maximum; see its _full and _len"

[[flag]]
name = "READ_FAILED"
bit = 1
doc = "a kernel or user memory read for this record failed; the affected field is empty or zero, and the failure is counted"

[[flag]]
name = "ISN"
bit = 2
doc = "NET v2: tcp_isn holds the connection's client initial sequence number (ADR-0022 rule 2); unset when it isn't known (rule 3)"

# ---- process spine (ADR-0003): SPINE class, never shed (ADR-0006) ----

[[record]]
name = "FORK"
type = 1
version = 1
class = "SPINE"
doc = "A task created a new task (tp_btf/sched_process_fork). The header names the parent; the fields name the child."
fields = [
  { name = "child_start_ns",      c = "u64", doc = "child's group_leader->start_boottime: equals the parent's start_ns for a thread, the child's own for a process" },
  { name = "child_task_start_ns", c = "u64", doc = "child task's own start_boottime (thread identity, ADR-0009)" },
  { name = "child_tgid",          c = "u32", doc = "child's thread-group id" },
  { name = "child_tid",           c = "u32", doc = "child's thread id" },
  { name = "kind",                c = "u32", doc = "1 = new process (child_tgid != tgid), 2 = new thread" },
]

[[record]]
name = "EXEC"
type = 2
version = 1
class = "SPINE"
doc = "A process replaced its program image (tp_btf/sched_process_exec). The header names the process after the exec; argv is the kernel's copy on the new stack (ADR-0003, E-0049)."
fields = [
  { name = "exe_ino",  c = "u64", doc = "bprm->file inode number" },
  { name = "exe_dev",  c = "u32", doc = "bprm->file superblock s_dev (kernel encoding, not st_dev)" },
  { name = "exe_gen",  c = "u32", doc = "bprm->file inode i_generation" },
  { name = "old_tid",  c = "u32", doc = "the exec'ing thread's tid before exec (differs from tgid after a non-leader exec)" },
]
var = [
  { name = "filename", max = 256,  doc = "bprm->filename: the path as passed to execve, or /dev/fd/N for execveat (not resolved; the resolved path joins from FILE_OPEN, Phase 2). The 256 cap is an inference, revisited with data; truncation is counted" },
  { name = "argv",     max = 1024, doc = "mm->arg_start..arg_end at sched_process_exec, NUL-separated. The 1024 cap is an inference, revisited with data; truncation is counted" },
]

[[record]]
name = "EXIT"
type = 3
version = 1
class = "SPINE"
doc = "A task exited (tp_btf/sched_process_exit). Fires per thread; group_dead = 1 on the thread that ends the process."
fields = [
  { name = "exit_code",  c = "i32", doc = "task->exit_code (wait status encoding)" },
  { name = "group_dead", c = "u32", doc = "1 if this exit ends the thread group" },
]

[[record]]
name = "RENAME"
type = 4
version = 1
class = "SPINE"
doc = "A task's comm changed (tp_btf/task_rename), including the rename every exec does."
fields = [
  { name = "old_comm", c = "char[16]", doc = "comm before" },
  { name = "new_comm", c = "char[16]", doc = "comm after" },
]

# ---- daemon records (ADR-0006 "daemon records", WAL ring 2): written by p15d, not by BPF ----
# Their header: ts_ns is CLOCK_BOOTTIME read by the daemon (the clock bpf_ktime_get_boot_ns
# reads); tgid, tid and start_ns name the daemon thread that wrote the record (ADR-0009).
# Counters marked "cumulative" count from the start of the run; "interval" fields cover the
# time since the previous STATS record.

[[record]]
name = "CLOCK_SYNC"
type = 32
version = 1
class = "MARKER"
doc = "The three clocks read back to back, repeated during the run so a reader can map boot time to wall time anywhere in a segment, not only at its header (ADR-0007 format rule 2, L5)."
fields = [
  { name = "boottime_ns",    c = "u64", doc = "CLOCK_BOOTTIME, read first; equals the header's ts_ns" },
  { name = "monotonic_ns",   c = "u64", doc = "CLOCK_MONOTONIC, read second" },
  { name = "realtime_ns",    c = "u64", doc = "CLOCK_REALTIME (wall time, UTC), read third" },
  { name = "read_spread_ns", c = "u64", doc = "CLOCK_BOOTTIME after the three reads minus boottime_ns: the anchors' uncertainty" },
]

[[record]]
name = "STATS"
type = 33
version = 1
class = "STATS"
doc = "The capture's own health, every stats interval (1 s by default), and once more at the end of the run (ADR-0019 G4.1). Spine counters are the BPF per-cause counters summed over CPUs (ADR-0006 rule 6)."
fields = [
  # spine counters per type and cause, cumulative (ADR-0006 rule 6; ADR-0019 G4.1 'per type')
  { name = "fork_seen",             c = "u64", doc = "FORK hook runs, cumulative" },
  { name = "fork_emitted",          c = "u64", doc = "FORK records submitted to the spine ring, cumulative" },
  { name = "fork_reserve_failed",   c = "u64", doc = "FORK records lost to a full ring, cumulative" },
  { name = "fork_build_failed",     c = "u64", doc = "FORK records lost before the ring (no buffer), cumulative" },
  { name = "fork_read_failed",      c = "u64", doc = "emitted FORK records with a failed memory read, cumulative" },
  { name = "fork_truncated",        c = "u64", doc = "emitted FORK records with a cut field, cumulative" },
  { name = "exec_seen",             c = "u64", doc = "EXEC hook runs, cumulative" },
  { name = "exec_emitted",          c = "u64", doc = "EXEC records submitted, cumulative" },
  { name = "exec_reserve_failed",   c = "u64", doc = "EXEC records lost to a full ring, cumulative" },
  { name = "exec_build_failed",     c = "u64", doc = "EXEC records lost before the ring, cumulative" },
  { name = "exec_read_failed",      c = "u64", doc = "emitted EXEC records with a failed memory read, cumulative" },
  { name = "exec_truncated",        c = "u64", doc = "emitted EXEC records with a cut field, cumulative" },
  { name = "exit_seen",             c = "u64", doc = "EXIT hook runs, cumulative" },
  { name = "exit_emitted",          c = "u64", doc = "EXIT records submitted, cumulative" },
  { name = "exit_reserve_failed",   c = "u64", doc = "EXIT records lost to a full ring, cumulative" },
  { name = "exit_build_failed",     c = "u64", doc = "EXIT records lost before the ring, cumulative" },
  { name = "exit_read_failed",      c = "u64", doc = "emitted EXIT records with a failed memory read, cumulative" },
  { name = "exit_truncated",        c = "u64", doc = "emitted EXIT records with a cut field, cumulative" },
  { name = "rename_seen",           c = "u64", doc = "RENAME hook runs, cumulative" },
  { name = "rename_emitted",        c = "u64", doc = "RENAME records submitted, cumulative" },
  { name = "rename_reserve_failed", c = "u64", doc = "RENAME records lost to a full ring, cumulative" },
  { name = "rename_build_failed",   c = "u64", doc = "RENAME records lost before the ring, cumulative" },
  { name = "rename_read_failed",    c = "u64", doc = "emitted RENAME records with a failed memory read, cumulative" },
  { name = "rename_truncated",      c = "u64", doc = "emitted RENAME records with a cut field, cumulative" },
  # the drain side of the books: emitted = drained (per type); drained = written + drain_lost (ADR-0006 rule 6)
  { name = "fork_drained",          c = "u64", doc = "FORK records the drain took from the ring and copied into a batch, cumulative" },
  { name = "exec_drained",          c = "u64", doc = "EXEC records drained, cumulative" },
  { name = "exit_drained",          c = "u64", doc = "EXIT records drained, cumulative" },
  { name = "rename_drained",        c = "u64", doc = "RENAME records drained, cumulative" },
  { name = "spine_invalid",         c = "u64", doc = "spine records refused by p15_rec_check, never written (run INVALID), cumulative" },
  { name = "spine_written",         c = "u64", doc = "spine records in batches the WAL writer appended, cumulative" },
  { name = "spine_drain_lost",      c = "u64", doc = "drained spine records in batches the writer could not append (run INVALID), cumulative" },
  { name = "gap_records",           c = "u64", doc = "GAP records the drain emitted, cumulative (ADR-0017 layer 4)" },
  # the drain's timing (ADR-0017 layers 2, 3 and 5; ADR-0019 G4.1 'poll-to-poll gap as a fixed histogram')
  { name = "poll_gap_le_100us",     c = "u64", doc = "drain polls that came at most 100 us after the previous one, cumulative" },
  { name = "poll_gap_le_1ms",       c = "u64", doc = "polls 100 us to 1 ms after the previous one, cumulative" },
  { name = "poll_gap_le_10ms",      c = "u64", doc = "polls 1 to 10 ms after, cumulative" },
  { name = "poll_gap_le_100ms",     c = "u64", doc = "polls 10 to 100 ms after, cumulative" },
  { name = "poll_gap_le_1s",        c = "u64", doc = "polls 100 ms to 1 s after, cumulative" },
  { name = "poll_gap_gt_1s",        c = "u64", doc = "polls more than 1 s after, cumulative" },
  { name = "poll_gap_max_ns",       c = "u64", doc = "the longest poll-to-poll gap in this interval: the worst drain stall (ADR-0017 layer 5)" },
  { name = "spine_fill_max",        c = "u64", doc = "the most bytes waiting in the spine ring at a poll, this interval (ADR-0019 G4.1 'fill high-water')" },
  { name = "queue_full",            c = "u64", doc = "times the drain found no free batch and left records in the ring, cumulative (ADR-0017 layer 2)" },
  # the WAL writer (ADR-0007; ADR-0019 G4.1 'WAL: bytes, batches, fsyncs, worst fsync latency')
  { name = "wal_bytes",             c = "u64", doc = "bytes written to the WAL, headers included, cumulative" },
  { name = "wal_batches",           c = "u64", doc = "batches appended, all rings, cumulative" },
  { name = "wal_fsyncs",            c = "u64", doc = "fdatasync calls on segments, cumulative" },
  { name = "wal_fsync_max_ns",      c = "u64", doc = "the slowest fdatasync in this interval (ADR-0017 evidence 9)" },
  # the daemon process (ADR-0019 G4.1 'CPU time and RSS (getrusage)')
  { name = "cpu_user_us",           c = "u64", doc = "the daemon's user CPU time, cumulative (getrusage RUSAGE_SELF)" },
  { name = "cpu_sys_us",            c = "u64", doc = "the daemon's system CPU time, cumulative" },
  { name = "maxrss_kb",             c = "u64", doc = "the daemon's peak resident set size, KiB (ru_maxrss)" },
  { name = "interval_ns",           c = "u64", doc = "CLOCK_BOOTTIME since the previous STATS record (or the run's start): the span the interval fields cover" },
  { name = "spine_ring_bytes",      c = "u32", doc = "the spine ring's size (also in the segment header), to read spine_fill_max against" },
  { name = "queue_depth_max",       c = "u32", doc = "the most full batches waiting for the writer, this interval (ADR-0019 G4.1 'queue depth high-water')" },
  { name = "queue_batches",         c = "u32", doc = "batches in the preallocated pool: the queue's capacity" },
  { name = "run_state",             c = "u32", doc = "0 RUNNING, 1 DEGRADED, 2 INVALID (ADR-0019 G2.3)" },
]

