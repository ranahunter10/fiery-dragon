[[record]]
name = "GAP"
type = 34
version = 1
class = "MARKER"
doc = "Spine records were lost between two reads of the loss counters: the window that contains the loss (ADR-0017 layer 4). Every process alive in [from_ns, to_ns] may be missing records."
fields = [
  { name = "from_ns",               c = "u64", doc = "CLOCK_BOOTTIME just before the previous counter read began" },
  { name = "to_ns",                 c = "u64", doc = "CLOCK_BOOTTIME just after this counter read ended" },
  { name = "spine_seq",             c = "u64", doc = "the spine sequence number the drain would give its next record at this read: records drained before it were in the ring before the read (ADR-0007 sequence; LTTng's packet numbering)" },
  { name = "fork_reserve_failed",   c = "u64", doc = "FORK records lost to a full ring in the window" },
  { name = "exec_reserve_failed",   c = "u64", doc = "EXEC records lost to a full ring in the window" },
  { name = "exit_reserve_failed",   c = "u64", doc = "EXIT records lost to a full ring in the window" },
  { name = "rename_reserve_failed", c = "u64", doc = "RENAME records lost to a full ring in the window" },
  { name = "fork_build_failed",     c = "u64", doc = "FORK records lost before the ring in the window" },
  { name = "exec_build_failed",     c = "u64", doc = "EXEC records lost before the ring in the window" },
  { name = "exit_build_failed",     c = "u64", doc = "EXIT records lost before the ring in the window" },
  { name = "rename_build_failed",   c = "u64", doc = "RENAME records lost before the ring in the window" },
]

