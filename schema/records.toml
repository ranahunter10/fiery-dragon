  { name = "unwritten",      c = "u64", doc = "checked PROC records the WAL refused (an I/O failure; the run is already INVALID)" },
  { name = "kthreads",       c = "u64", doc = "entries that are kernel threads (no argv, no executable)" },
  { name = "exiting",        c = "u64", doc = "entries already exiting, without an mm (no argv, no executable): not read failures" },
  { name = "argv_failed",    c = "u64", doc = "entries whose argv could not be read (bpf_copy_from_user_task failed): P15_F_READ_FAILED" },
  { name = "path_unlocked",  c = "u64", doc = "entries whose executable path was not read because the task's mmap lock was busy or the iterator could not start: P15_F_READ_FAILED" },
  { name = "path_not_found", c = "u64", doc = "entries whose mapping at mm->start_code is not mm->exe_file, so the path is not read: P15_F_READ_FAILED" },
  { name = "path_failed",    c = "u64", doc = "entries where bpf_d_path failed for another reason than length: P15_F_READ_FAILED" },
  { name = "truncated",      c = "u64", doc = "fields cut: an argv longer than its maximum, or a path longer than its maximum (a record with both counts twice); each such entry has P15_F_TRUNCATED" },
  { name = "fd_duration_ns", c = "u64", doc = "CLOCK_BOOTTIME of the FD pass, from creating its iterator to its end of output; 0 without the pass" },
  { name = "fd_files",       c = "u64", doc = "descriptors the task_file iterator showed the program (thread-group fd tables; threads sharing the leader's table are skipped by the kernel)" },
  { name = "fd_no_inode",    c = "u64", doc = "descriptors whose file has no inode: not recorded (never expected)" },
  { name = "fd_emitted",     c = "u64", doc = "FD records the program wrote to the iterator's output" },
  { name = "fd_write_failed", c = "u64", doc = "bpf_seq_write refused an FD record: that descriptor is missing (run INVALID)" },
  { name = "fd_entries",     c = "u64", doc = "FD records that passed p15_rec_check and went into the WAL" },
  { name = "fd_invalid",     c = "u64", doc = "FD output that failed p15_rec_check or did not frame: counted, never written (run INVALID)" },
  { name = "fd_unwritten",   c = "u64", doc = "checked FD records the WAL refused" },
  { name = "fd_known",       c = "u64", doc = "emitted FD rows whose open file capture had already registered (an OPEN, or an earlier snapshot): the existing ids, first registration wins (ADR-0015 rule 7)" },
  { name = "fd_registered",  c = "u64", doc = "emitted FD rows that registered their open file now (opened before capture began)" },
  { name = "fd_map_full",    c = "u64", doc = "emitted FD rows written with a fresh, unregistered open-file id because the open-file map was full" },
  { name = "fd_path_error",  c = "u64", doc = "emitted FD rows whose bpf_d_path failed for a reason other than length (PATH_ERROR)" },
  { name = "fd_truncated",   c = "u64", doc = "emitted FD rows whose path did not fit (the dentry name, TRUNCATED)" },
  { name = "snap_id",        c = "u32", doc = "as in PROC" },
  { name = "error",          c = "i32", doc = "0, or the negative errno that ended reading the iterator early (then the snapshot is incomplete and the run INVALID)" },
  { name = "fd_error",       c = "i32", doc = "0, or the negative errno that ended the FD pass early (snapshot incomplete, run INVALID)" },
  { name = "kind",           c = "u16", doc = "as in PROC" },
  { name = "fd_pass",        c = "u16", doc = "1 if the FD pass ran (file identity loaded), 0 if not (--no-files): then every fd_* field is 0" },
]

# ---- file identity (ADR-0015, ADR-0027; STATE decision 19): OPEN class, on the bulk ring, counted loss ----
# Record-field flags: the u32 `fflags` of the records below (decision 19.3; the header's u16 flags are
# shared by every type).
[[fflag]]
name = "OBJ_NEW"
bit = 0
doc = "the record carries the object's facts (its `facts` part): the first record capture wrote for this object id, or a repeat (ADR-0015 rule 2; decision 19.7)"

[[fflag]]
name = "USER_OBJ_NEW"
bit = 1
doc = "BACKING: the record carries the overlay object's facts (its `user_facts` part)"

[[fflag]]
name = "PATH_MISSING"
bit = 2
doc = "OPEN written by the kprobe.session return because the path fentry did not run for this open (skipped for another task, ADR-0015 rule 6), without a path: the walk could not name it (a filesystem whose d_dname it does not know, a task without fs; ADR-0029 rule 2). Nothing guessed"

[[fflag]]
name = "PATH_ERROR"
bit = 3
doc = "bpf_d_path failed for a reason other than length: the path is empty and path_err holds the errno"

[[fflag]]
name = "FULL_SIZE"
bit = 4
doc = "OPEN: no path scratch slot was free, so the record was reserved at its maximum size; the bytes after the path are zero (ADR-0015 rule 6)"

[[fflag]]
name = "NEVER_OPENED"
bit = 5
doc = "CLOSE: the struct file was freed without FMODE_OPENED: its open failed after security_file_open, in ->open (ADR-0015 rule 5)"

[[fflag]]
name = "KTHREAD"
bit = 6
doc = "the record was written in a kernel thread (PF_KTHREAD): its header names that thread, not the file's user (ADR-0015 rule 8)"

[[fflag]]
name = "PATH_WALKED"
bit = 7
doc = "OPEN written by the kprobe.session return because the path fentry did not run: the path is the bounded dentry walk's (bpf/include/p15_dpath.h, ADR-0029), equal to bpf_d_path's in every case the harness checks; with TRUNCATED, its last components, not rooted"

[[fflag]]
name = "PATH_RACED"
bit = 8
doc = "with PATH_WALKED: a rename or mount changed the tree during both tries of the walk, so the path may join two states of it; kept, not trusted (ADR-0029 rule 3)"

[[fflag]]
name = "UNREGISTERED"
bit = 9
doc = "FLOW: no open-file entry could be made (its map was full, ADR-0015 rule 9): fid is fresh and names this record only; obj is the object's id, with its facts here when OBJ_NEW (ADR-0005 rule 8)"

[[fflag]]
name = "PEEK"
bit = 10
doc = "FLOW of kind RECV: the receive had MSG_PEEK, so the data stayed queued (ADR-0005 rule 2); part of the aggregate's key"

[[fflag]]
name = "VECTORED"
bit = 11
doc = "FLOW of kind READ or WRITE: the transfer was vfs_readv or vfs_writev; part of the aggregate's key"

[[fflag]]
name = "START_UNKNOWN"
bit = 12
doc = "FLOW of kind READ or WRITE: the first event's start time was not kept, so first_ts is that event's end (counted in FLOW_STATS)"

[[part]]
name = "OBJFACTS"
doc = "An object's facts (ADR-0015 rule 2): what the kernel says about one in-memory inode when capture first names it. The reader decides the graph node from them (rule 3, ADR-0027)."
fields = [
  { name = "ino",      c = "u64", doc = "i_ino" },
  { name = "subvol",   c = "u64", doc = "btrfs: the subvolume's root id (what statx reports as stx_subvol); 0 elsewhere, and 0 with SUBVOL_UNKNOWN" },
  { name = "dev",      c = "u32", doc = "i_sb->s_dev, kernel encoding (major << 20 | minor)" },
  { name = "gen",      c = "u32", doc = "i_generation (random on ext4, xfs v3 and tmpfs; a transaction id on btrfs; 0 on pipes, sockets, overlay and others)" },
  { name = "mode",     c = "u32", doc = "i_mode: file type and permission bits" },
  { name = "fs_magic", c = "u32", doc = "low 32 bits of i_sb->s_magic: ext4 0xEF53, tmpfs 0x01021994, btrfs 0x9123683E, overlayfs 0x794C7630, pipefs 0x50495045, sockfs 0x534F434B, anonymous inodes 0x09041934 (include/uapi/linux/magic.h)" },
  { name = "nlink",    c = "u32", doc = "i_nlink when the facts were read; 0 = unlinked (a deleted file, a memfd, an O_TMPFILE)" },
  { name = "seen",     c = "u16", doc = "how capture first saw the object: 1 open, 2 snapshot FD pass, 3 first I/O, 4 mmap, 5 network (2a writes 1 and 2)" },
  { name = "oflags",   c = "u16", doc = "bit 0 SUBVOL_UNKNOWN: a btrfs object (fs_magic 0x9123683E) while btrfs's BTF was absent at load, so subvol was not read and the reader gives it a node per lifetime (ADR-0015 rule 2); other bits zero" },
]

[[record]]
name = "OPEN"
type = 6
version = 1
class = "OPEN"
doc = "One open that reached security_file_open (ADR-0015 rule 6). Written by the fentry with bpf_d_path's path, or, when the fentry did not run, by the kprobe.session return with the walked path (PATH_WALKED) or none (PATH_MISSING) (ADR-0029). An FMODE_BACKING open writes BACKING instead, from either program. The header names the task that opened."
fields = [
  { name = "fid",      c = "u64", doc = "the open-file id (ADR-0015 rule 1): one struct file for its lifetime; shared by fork, dup and SCM_RIGHTS" },
  { name = "obj",      c = "u64", doc = "the object id of the file's inode (ADR-0015 rule 1)" },
  { name = "fflags",   c = "u32", doc = "P15_FF_* (OBJ_NEW, PATH_MISSING, PATH_WALKED, PATH_RACED, PATH_ERROR, FULL_SIZE, KTHREAD)" },
  { name = "f_flags",  c = "u32", doc = "file->f_flags: the open flags (O_ACCMODE, O_APPEND, O_CREAT, ...) as the kernel holds them" },
  { name = "f_mode",   c = "u32", doc = "file->f_mode at security_file_open (FMODE_READ, FMODE_WRITE, ...; FMODE_OPENED is not set yet)" },
  { name = "verdict",  c = "i32", doc = "with PATH_MISSING or PATH_WALKED (the session's return wrote it): security_file_open's return; otherwise 0, and a denial follows as OPEN_VERDICT" },
  { name = "path_err", c = "i32", doc = "with PATH_ERROR: bpf_d_path's negative errno; else 0" },
]
var = [
  { name = "facts", part = "OBJFACTS", doc = "the object's facts, present exactly when fflags has OBJ_NEW" },
  { name = "path", max = 4096, doc = "bpf_d_path(&file->f_path) without its NUL: the kernel's own path (mounts crossed, ' (deleted)' kept, the task's root); with PATH_WALKED the walk's, which is the same string. A path longer than PATH_MAX is the dentry name with header flag TRUNCATED (with PATH_WALKED: its last components); empty with PATH_MISSING or PATH_ERROR" },
]

[[record]]
name = "OPEN_VERDICT"
type = 7
version = 1
class = "OPEN"
doc = "The LSM denied an open whose OPEN the fentry already wrote (ADR-0015 rule 6): written by the kprobe.session return."
fields = [
  { name = "fid",      c = "u64", doc = "the open-file id of that OPEN" },
  { name = "verdict",  c = "i32", doc = "security_file_open's negative return" },
  { name = "fflags",   c = "u32", doc = "P15_FF_KTHREAD or 0" },
]

[[record]]
name = "BACKING"
type = 8
version = 1
class = "OPEN"
doc = "An overlayfs backing file was opened (FMODE_BACKING at security_file_open, ADR-0015 rule 4): the real upper or lower file standing for an overlay file. Bytes are counted once, on the overlay file; this record joins the two objects."
fields = [
  { name = "fid",      c = "u64", doc = "the backing file's own open-file id" },
  { name = "obj",      c = "u64", doc = "the backing (real) file's object id" },
  { name = "user_obj", c = "u64", doc = "the overlay inode's object id (backing_file_user_path(file)->dentry->d_inode); 0 if it could not be read (READ_FAILED)" },
  { name = "fflags",   c = "u32", doc = "P15_FF_* (OBJ_NEW, USER_OBJ_NEW, KTHREAD)" },
  { name = "f_flags",  c = "u32", doc = "the backing file's f_flags" },
  { name = "f_mode",   c = "u32", doc = "the backing file's f_mode (FMODE_BACKING set)" },
]
var = [
  { name = "facts",      part = "OBJFACTS", doc = "the backing object's facts, present exactly with OBJ_NEW" },
  { name = "user_facts", part = "OBJFACTS", doc = "the overlay object's facts, present exactly with USER_OBJ_NEW" },
]

[[record]]
name = "CLOSE"
type = 9
version = 1
class = "OPEN"
doc = "A struct file capture had registered was freed (security_file_free, ADR-0015 rule 8): the end of its open-file id. Belongs to the open file, not to a process: the header names whichever task freed it (the closer, task work, or the delayed_fput worker, flagged KTHREAD)."
fields = [
  { name = "fid",      c = "u64", doc = "the open-file id that ends" },
  { name = "obj",      c = "u64", doc = "its object id; 0 when no program of the open computed it (the path program skipped and the session's return missed, both counted)" },
  { name = "fflags",   c = "u32", doc = "P15_FF_* (NEVER_OPENED, KTHREAD)" },
  { name = "f_mode",   c = "u32", doc = "file->f_mode at the free" },
]

[[record]]
name = "FILE"
type = 11
version = 1
class = "OPEN"
doc = "An open file first seen at its first transfer (ADR-0015 rule 5): one that never reached security_file_open (a pseudo file from alloc_file_pseudo: pipes, sockets, memfds, anonymous inodes) and was not in the snapshot, or a regular file whose open capture missed. Written once per open-file id, before the FLOW that found it, by the program that found it. The header names that task."
fields = [
  { name = "fid",      c = "u64", doc = "the open-file id it registers (ADR-0015 rule 1)" },
  { name = "obj",      c = "u64", doc = "the object id of the file's inode" },
  { name = "fflags",   c = "u32", doc = "P15_FF_OBJ_NEW or 0" },
  { name = "f_flags",  c = "u32", doc = "file->f_flags" },
  { name = "f_mode",   c = "u32", doc = "file->f_mode" },
  { name = "seen",     c = "u32", doc = "where the open file was first seen, as OBJFACTS.seen: 3 first I/O (step 2b), 4 mmap (2d), 5 network (2e)" },
]
var = [
  { name = "facts", part = "OBJFACTS", doc = "the object's facts, present exactly when fflags has OBJ_NEW" },
  { name = "name",  max = 63, doc = "file->f_path.dentry->d_name, without its NUL: 'memfd:<name>', an anonymous inode's '[eventfd]', a socket's protocol ('TCP', 'UNIX'), empty for a pipe; the reader builds pipe:[ino] and socket:[ino] from the facts. A longer name is cut at 63 bytes with header flag TRUNCATED, and name_full holds its length" },
]

# ---- the snapshot's FD pass (ADR-0015 rule 7): written by the iter/task_file program into p15d's
# daemon ring with the PROC records, MARKER class like them.
[[record]]
name = "FD"
type = 39
version = 1
class = "MARKER"
doc = "One open descriptor of a thread-group leader in a process snapshot (ADR-0015 rule 7): the files already open when capture began, standard streams included, and again in every segment's opening snapshot. The header names the descriptor's process (ADR-0009). It carries the object's facts always (decision 19.2), so a segment can be read alone."
fields = [
  { name = "fid",      c = "u64", doc = "the open-file id (the existing one if the file was already registered: the first registration wins)" },
  { name = "obj",      c = "u64", doc = "the object id" },
  { name = "pos",      c = "u64", doc = "file->f_pos when the iterator saw it" },
  { name = "fd",       c = "u32", doc = "the descriptor number" },
  { name = "fflags",   c = "u32", doc = "P15_FF_PATH_ERROR or 0" },
  { name = "f_flags",  c = "u32", doc = "file->f_flags" },
  { name = "f_mode",   c = "u32", doc = "file->f_mode" },
  { name = "path_err", c = "i32", doc = "with PATH_ERROR: bpf_d_path's negative errno; else 0" },
  { name = "snap_id",  c = "u32", doc = "as in PROC" },
]
var = [
  { name = "facts", part = "OBJFACTS", doc = "the object's facts: always present (40 bytes)" },
  { name = "path", max = 4096, doc = "bpf_d_path of the file, as in OPEN (anon_inode:[eventpoll], pipe:[N] and socket:[N] are the kernel's own names)" },
]

[[record]]
name = "FILE_STATS"
type = 40
version = 1
class = "STATS"
doc = "The file-identity programs' health, written with every STATS record (ADR-0015, STATE decision 19): the counters of bpf/include/p15_file.h since the run's start, their books' drain side, the maps' fill and the kernel's skips. The books close as p15_file.h states; a lost OPEN, BACKING, CLOSE or session record, or a skipped session or free, makes the run DEGRADED."
fields = [
  { name = "fentry_run", c = "u64", doc = "the path fentry ran; cumulative" },
  { name = "fentry_no_inode", c = "u64", doc = "... for a file without an inode (never expected: counted, nothing written); cumulative" },
  { name = "open_emitted", c = "u64", doc = "OPEN records the fentry submitted; cumulative" },
  { name = "open_lost", c = "u64", doc = "... lost to a full bulk ring (run DEGRADED); cumulative" },
  { name = "open_full_size", c = "u64", doc = "... written full size: no scratch slot was free (rule 6); cumulative" },
  { name = "open_truncated", c = "u64", doc = "... whose path did not fit (dentry name, TRUNCATED); cumulative" },
  { name = "open_path_error", c = "u64", doc = "... whose bpf_d_path failed otherwise (PATH_ERROR); cumulative" },
  { name = "backing_emitted", c = "u64", doc = "BACKING records submitted; cumulative" },
  { name = "backing_lost", c = "u64", doc = "BACKING records lost to a full bulk ring (run DEGRADED); cumulative" },
  { name = "backing_user_unread", c = "u64", doc = "BACKING without the overlay inode (user_obj 0, READ_FAILED); cumulative" },
  { name = "session_entry", c = "u64", doc = "the kprobe.session ran at entry; cumulative" },
  { name = "session_no_inode", c = "u64", doc = "... for a file without an inode: no return run; cumulative" },
  { name = "session_return", c = "u64", doc = "the session's return run; cumulative" },
  { name = "session_common", c = "u64", doc = "... with the OPEN written and verdict 0: nothing to write; cumulative" },
  { name = "missing_emitted", c = "u64", doc = "OPEN with PATH_MISSING (the fentry did not run); cumulative" },
  { name = "missing_lost", c = "u64", doc = "PATH_MISSING OPEN records lost to a full bulk ring (run DEGRADED); cumulative" },
  { name = "verdict_emitted", c = "u64", doc = "OPEN_VERDICT; cumulative" },
  { name = "verdict_lost", c = "u64", doc = "OPEN_VERDICT records lost to a full bulk ring (run DEGRADED); cumulative" },
  { name = "session_no_cookie", c = "u64", doc = "return run with an empty cookie (never expected); cumulative" },
  { name = "session_no_entry", c = "u64", doc = "return run without an open-file entry (its map was full); cumulative" },
  { name = "free_run", c = "u64", doc = "security_file_free ran (every struct file of the system); cumulative" },
  { name = "close_emitted", c = "u64", doc = "CLOSE records submitted; cumulative" },
  { name = "close_lost", c = "u64", doc = "CLOSE records lost to a full bulk ring (run DEGRADED); cumulative" },
  { name = "free_unregistered", c = "u64", doc = "a free of a file capture never registered (decision 19.5); cumulative" },
  { name = "inode_free_run", c = "u64", doc = "security_inode_free ran; cumulative" },
  { name = "inode_free_hit", c = "u64", doc = "... and deleted an object entry; cumulative" },
  { name = "file_map_full", c = "u64", doc = "no open-file entry: the event is written with a fresh, unregistered id; cumulative" },
  { name = "obj_map_full", c = "u64", doc = "no object entry: the facts go inline, with a fresh id; cumulative" },
  { name = "file_stale", c = "u64", doc = "an entry whose stored inode differs from the live file's: replaced (rule 9); cumulative" },
  { name = "obj_stale", c = "u64", doc = "an entry whose dev/ino/gen differ from the live inode's: replaced; cumulative" },
  { name = "file_race", c = "u64", doc = "another program inserted the entry between lookup and insert; cumulative" },
  { name = "obj_race", c = "u64", doc = "another program inserted the object entry between lookup and insert; cumulative" },
  { name = "facts_dup", c = "u64", doc = "a second record carried an object's facts (decision 19.7: twice, never zero); cumulative" },
  { name = "subvol_unknown", c = "u64", doc = "facts of a btrfs object read without btrfs BTF (oflags SUBVOL_UNKNOWN); cumulative" },
  { name = "kthread_open", c = "u64", doc = "OPEN records written in a kernel thread (KTHREAD); cumulative" },
  { name = "files_live",      c = "u64", doc = "open-file entries now (the FILES_LIVE gauge)" },
  { name = "objs_live",       c = "u64", doc = "object entries now (the OBJS_LIVE gauge)" },
  { name = "files_live_max",  c = "u64", doc = "the most open-file entries the drain saw at a poll, since the run's start" },
  { name = "objs_live_max",   c = "u64", doc = "the most object entries the drain saw at a poll, since the run's start" },
  { name = "file_drained",    c = "u64", doc = "file-identity records the drain copied into a batch, cumulative" },
  { name = "file_invalid",    c = "u64", doc = "file-identity records refused by p15_rec_check, never written (run DEGRADED), cumulative" },
  { name = "fentry_missed",   c = "u64", doc = "opens whose path fentry the kernel skipped (its recursion_misses): each has an OPEN with PATH_MISSING, so not a loss" },
  { name = "kprobe_missed",   c = "u64", doc = "runs the kernel skipped of the session and the two free programs (recursion_misses; run DEGRADED)" },
  { name = "file_map_entries", c = "u32", doc = "the open-file map's size (--file-map-entries)" },
  { name = "obj_map_entries",  c = "u32", doc = "the object map's size (--obj-map-entries)" },
]

