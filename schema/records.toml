  { name = "facts_dup", c = "u64", doc = "a second record carried an object's facts (decision 19.7: twice, never zero); cumulative" },
  { name = "subvol_unknown", c = "u64", doc = "facts of a btrfs object read without btrfs BTF (oflags SUBVOL_UNKNOWN); cumulative" },
  { name = "kthread_open", c = "u64", doc = "OPEN records written in a kernel thread (KTHREAD); cumulative" },
  { name = "walked", c = "u64", doc = "the session return's OPENs with the walked path (PATH_WALKED); with walk_unnamed, missing_emitted; cumulative" },
  { name = "walk_raced", c = "u64", doc = "... of which PATH_RACED: the tree moved during both tries; cumulative" },
  { name = "walk_truncated", c = "u64", doc = "... of which TRUNCATED: a bound of the walk cut the path; cumulative" },
  { name = "walk_unnamed", c = "u64", doc = "the session return's OPENs without a path (PATH_MISSING): an unknown d_dname, no fs, no scratch; cumulative" },
  { name = "ret_backing", c = "u64", doc = "session returns, with the fentry skipped, for an FMODE_BACKING file: BACKING written or lost; cumulative" },
  { name = "ret_backing_emitted", c = "u64", doc = "BACKING records the session return submitted; cumulative" },
  { name = "ret_backing_lost", c = "u64", doc = "... lost to a full bulk ring (run DEGRADED); cumulative" },
  { name = "ret_backing_verdict_emitted", c = "u64", doc = "OPEN_VERDICT records after such a BACKING (a denial); cumulative" },
  { name = "ret_backing_verdict_lost", c = "u64", doc = "... lost to a full bulk ring (run DEGRADED); cumulative" },
  { name = "files_live",      c = "u64", doc = "open-file entries now (the FILES_LIVE gauge)" },
  { name = "objs_live",       c = "u64", doc = "object entries now (the OBJS_LIVE gauge)" },
  { name = "files_live_max",  c = "u64", doc = "the most open-file entries the drain saw at a poll, since the run's start" },
  { name = "objs_live_max",   c = "u64", doc = "the most object entries the drain saw at a poll, since the run's start" },
  { name = "file_drained",    c = "u64", doc = "file-identity records the drain copied into a batch, cumulative" },
  { name = "file_invalid",    c = "u64", doc = "file-identity records refused by p15_rec_check, never written (run DEGRADED), cumulative" },
  { name = "fentry_missed",   c = "u64", doc = "opens whose path fentry the kernel skipped (its recursion_misses): each has an OPEN with PATH_MISSING, so not a loss" },
  { name = "kprobe_missed",   c = "u64", doc = "runs the kernel skipped of the session and the two free programs (recursion_misses; run DEGRADED)" },
  { name = "file_map_entries", c = "u32", doc = "the open-file map's size (--file-map-entries)" },
  { name = "obj_map_entries",  c = "u32", doc = "the object map's size (--obj-map-entries)" },
]

# ---- data flow (ADR-0005; STATE decision 18): FLOW class, on the bulk ring, counted loss ----
[[enum]]
name = "FLOW_KIND"
field = "FLOW.kind"
doc = "the transfer's direction and hook family (ADR-0005 rule 2)"
values = [
  { name = "READ",  value = 1, doc = "vfs_read, vfs_readv: object -> process" },
  { name = "WRITE", value = 2, doc = "vfs_write, vfs_writev: process -> object" },
  { name = "RECV",  value = 3, doc = "sock:sock_recv_length: socket -> process" },
  { name = "SEND",  value = 4, doc = "sock:sock_send_length: process -> socket" },
]

[[enum]]
name = "FLOW_REASON"
field = "FLOW.reason"
doc = "why the aggregate was written (ADR-0005 rule 7)"
values = [
  { name = "SINGLE",    value = 1,  doc = "folding is off (ADR-0005 rule 13; step 2b): one transfer, count 1" },
  { name = "OBJ_FLOW",  value = 2,  doc = "the object had a flow that blocks the fold (rule 5)" },
  { name = "PROC_FLOW", value = 3,  doc = "the process had a flow that blocks the fold (rule 5)" },
  { name = "OTHER_KEY", value = 4,  doc = "another process, thread, kind or flags on the same open file (rule 4)" },
  { name = "EXEC",      value = 5,  doc = "the owner exec'd (rule 7)" },
  { name = "EXIT",      value = 6,  doc = "the owner exited (rule 7)" },
  { name = "SWEEP",     value = 7,  doc = "the once-a-second sweep on the fdatasync tick (rule 9)" },
  { name = "SEGMENT",   value = 8,  doc = "the sweep before a segment rotation (rule 9)" },
  { name = "END",       value = 9,  doc = "the final sweep at an orderly stop (rule 9)" },
  { name = "RACE",      value = 10, doc = "the aggregate was busy or taken: the event is written alone (rule 10)" },
  { name = "MAP_FULL",  value = 11, doc = "no open-file entry: the event is written alone, UNREGISTERED (rule 8)" },
  { name = "MARK_LOST", value = 12, doc = "a mark the check needed was missing (rule 5)" },
]

[[record]]
name = "FLOW"
type = 10
version = 1
class = "FLOW"
doc = "Data moved between a process and an object through one open file (ADR-0005 rule 8): one transfer, or an aggregate of transfers with the same key that Xu's checks let fold (step 2c). The header names the thread of the first event (its tgid, tid and start_ns), not necessarily the task that wrote the record; its ts_ns is when the record was written, so records stay in ring order and the reader sorts by first_ts. An aggregate pending when its open file is freed travels in CLOSE (step 2c), not here."
fields = [
  { name = "fid",      c = "u64", doc = "the open-file id (ADR-0015 rule 1); with UNREGISTERED, a fresh id of this record only" },
  { name = "obj",      c = "u64", doc = "the object id of the file's inode" },
  { name = "first_ts", c = "u64", doc = "start of the first event, CLOCK_BOOTTIME ns; with START_UNKNOWN its end; a socket event is an instant (ADR-0005 rule 5)" },
  { name = "last_ts",  c = "u64", doc = "end of the last event, CLOCK_BOOTTIME ns" },
  { name = "bytes",    c = "u64", doc = "bytes moved, the sum of the events' returns (each at least 1: failed and empty transfers are counted, not recorded)" },
  { name = "count",    c = "u32", doc = "events in the aggregate, at least 1; 1 with reason SINGLE" },
  { name = "fflags",   c = "u32", doc = "P15_FF_* (OBJ_NEW, UNREGISTERED, PEEK, VECTORED, START_UNKNOWN)" },
  { name = "kind",     c = "u16", doc = "P15_FLOW_KIND_*" },
  { name = "reason",   c = "u16", doc = "P15_FLOW_REASON_*: why it was written" },
]
var = [
  { name = "facts", part = "OBJFACTS", doc = "the object's facts, present exactly when fflags has OBJ_NEW, which only an UNREGISTERED FLOW carries (ADR-0015 rule 2)" },
]
