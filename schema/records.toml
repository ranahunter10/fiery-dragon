  { name = "self_exec_id",    c = "u64", doc = "leader task->self_exec_id (ADR-0020 rule 5): matches the last EXEC of this process when the run holds it" },
  { name = "exe_ctime_ns",    c = "u64", doc = "exe inode i_ctime in ns; 0 for a kernel thread" },
  { name = "exe_mtime_ns",    c = "u64", doc = "exe inode i_mtime in ns; 0 for a kernel thread" },
  { name = "parent_tgid",     c = "u32", doc = "real_parent->tgid" },
  { name = "exe_dev",         c = "u32", doc = "mm->exe_file superblock s_dev (kernel encoding, not st_dev)" },
  { name = "exe_gen",         c = "u32", doc = "mm->exe_file inode i_generation" },
  { name = "exe_nlink",       c = "u32", doc = "exe inode link count; 0 = unlinked backing (memfd, deleted, O_TMPFILE); 0 for a kernel thread" },
  { name = "exe_fs_magic",    c = "u32", doc = "low 32 bits of the exe superblock s_magic (see EXEC); 0 for a kernel thread" },
  { name = "exe_mode",        c = "u32", doc = "exe inode i_mode; 0 for a kernel thread" },
  { name = "exe_uid",         c = "u32", doc = "exe inode owner uid; 0 for a kernel thread" },
  { name = "exe_gid",         c = "u32", doc = "exe inode owner gid; 0 for a kernel thread" },
  { name = "uid",             c = "u32", doc = "leader real uid (from task->cred)" },
  { name = "euid",            c = "u32", doc = "leader effective uid" },
  { name = "gid",             c = "u32", doc = "leader real gid" },
  { name = "egid",            c = "u32", doc = "leader effective gid" },
  { name = "fsuid",           c = "u32", doc = "leader fsuid" },
  { name = "fsgid",           c = "u32", doc = "leader fsgid" },
  { name = "pflags",          c = "u32", doc = "bit 0 kernel thread (PF_KTHREAD: no mm, no argv, no exe), bit 1 exiting (PF_EXITING)" },
  { name = "snap_id",         c = "u32", doc = "which snapshot of the run: 0, 1, 2, ... in the order they were taken" },
  { name = "comm",            c = "char[16]", doc = "task->comm of the leader, NUL-padded" },
  { name = "kind",            c = "u16", doc = "1 opening (segment open), 2 closing (orderly stop, ADR-0023)" },
