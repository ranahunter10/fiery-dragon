  { name = "net_excluded",       c = "u64", doc = "hook runs not recorded by policy: failed accepts, non-IP sockets, no sock (ADR-0004 rule 3), cumulative" },
  { name = "net_drained",        c = "u64", doc = "NET records the drain copied into a batch, cumulative" },
  { name = "net_invalid",        c = "u64", doc = "bulk records refused by p15_rec_check, never written, cumulative" },
  { name = "net_written",        c = "u64", doc = "bulk records in batches the writer appended, cumulative" },
