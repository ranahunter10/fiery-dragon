# SPDX-License-Identifier: MIT
# CI skeleton (blueprint v1 §10, Phase 0 gate: "lint / unit / verifier on an empty program").
# Runs on every PR and on pushes to main. The runner's kernel is NOT the target
# (7.0.0-38 on the VM): the bpf job proves the toolchain and the verifier path only.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: lint, unit tests, evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2          # the whitespace check diffs against the first parent
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"  # the VM's Python (E-0054)
      - name: Tools
        run: |
          python -m pip install ruff==0.16.9 packaging==26.3
          python -m pip install --require-hashes "--only-binary=:all:" -r python/requirements.txt
      - name: Lint (syntax errors and pyflakes)
        run: ruff check --select E9,F --extend-exclude third_party --output-format github .
      - name: Whitespace (evidence and fixtures are exempt via .gitattributes)
        run: git diff --check HEAD^1 HEAD
      - name: Schema (generated files current, layouts locked; ADR-0008)
        run: python schema/gen/gen.py --check
      - name: One fatal path (no exit/_exit/abort in daemon/ outside marked sites; ADR-0019 G2)
        run: python tools/ci/check_exits.py daemon
      - name: Code map current (docs/CODEMAP.md)
        run: python tools/codemap.py --check
      - name: Unit tests (every test file on its own)
        run: tools/ci/run-tests.sh
      - name: Evidence checksums
        run: tools/ci/check-evidence.sh
      - name: Journals keep their shape (fields, ids, grades)
        run: python tools/ci/check_csv.py

  bpf:
    name: BPF build (vendored libbpf/bpftool) and smoke load (runner kernel, not the target)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive   # third_party/libbpf v1.7.0, third_party/bpftool v7.7.0 (ADR-0002)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"  # the VM's Python (E-0054); the Python reader reads every run
      - name: Python reader packages (pinned with hashes)
        run: python -m pip install --require-hashes "--only-binary=:all:" -r python/requirements.txt
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang llvm gcc make pkg-config libelf-dev zlib1g-dev libssl-dev python3-numpy strace
          uname -r; clang --version | head -1
      - name: vmlinux.h checksum
        run: cd bpf/vmlinux && sha256sum -c SHA256SUMS
      - name: Build (libbpf, bpftool, BPF objects, skeletons, loaders)
        run: make -j"$(nproc)"
      - name: Pinned versions
        run: |
          git submodule status
          build/bpftool/bootstrap/bpftool version
      - name: Hardening present in the daemon binaries (PIE, RELRO, NX, canary, FORTIFY, CET; ADR-0019 G3)
        run: make hardening-check
      - name: C unit tests (record checks, self-test evaluation, WAL writer, exit codes, must-check gate)
        run: make test-c
      - name: Clang build and C tests, -Werror (ADR-0019 G3)
        run: make CC=clang OUT=build-clang -j"$(nproc)" all test-c
      - name: C unit tests under ASan and UBSan
        run: make test-c-asan
      - name: Three-way layout check (generator vs BTF vs numpy; ADR-0008)
        run: make layout-check
      - name: Smoke (verifier load; tp_btf attach; spine self-test, ADR-0003)
        run: sudo make smoke
      - name: The queue under ThreadSanitizer (ADR-0017 layer 2)
        run: make test-c-tsan
      - name: The Python reader decodes what the C writer wrote, field by field
        run: make it-pyreader
      - name: p15d end to end, network capture required (runner kernel, not the target)
        run: sudo P15_PYTHON="$(command -v python3)" P15_IT_NET=1 P15_IT_KEEP=build/it-runs make it-p15d
      - name: Keep the network run and its p15-trace reports (raw evidence for the PR)
        if: always()
        run: sudo chmod -R a+rX build/it-runs 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: it-p15d-net-run
          path: build/it-runs
          if-no-files-found: warn
          retention-days: 30
      - name: Recursion-miss probe (E-0089; which hook and wake-up design the kernel skips least; runner kernel, not the target)
        run: sudo make probe-recursion ROUNDS=3 EXECS=2000
      - name: Step 2b read-hook cost harness loads and its books close (flow_cost; runner kernel, a smoke test, not a measurement)
        run: sudo make bench-flow-cost ROUNDS=2 READS=20000 CHECKS=2000
      - name: Network-intent probe (fexit hooks of ADR-0004; runner kernel, not the target)
        run: uname -r && sudo make smoke-net
      - name: Step 2a dry run (ADR-0015 identity mechanisms, with an overlay mount; runner kernel, not the target)
        run: sudo build/sliceb_probe --overlay
      - name: Open-cost harness (decision 22a.4) runs p15d on against off and the capture books close; not a measurement (runner kernel, not the target)
        run: |
          sudo make bench-open-cost P15_PYTHON="$(command -v python3)" ROUNDS=2 SAME=20000 DISTINCT=2000 DIR=/var/tmp/p15-open-cost > build/open_cost.log 2>&1 || { tail -40 build/open_cost.log; exit 1; }
          grep '^capture' build/open_cost.txt && tail -12 build/open_cost.md
      - name: Building-block cost harness loads and every iteration does its work; not a measurement (runner kernel, not the target)
        run: sudo build/prim_cost 2 5000 > build/prim_cost.txt && python3 bench/prim_cost/summarize.py build/prim_cost.txt
      - name: Section-timing harness loads the profiled file programs, single and contend, and its books close; not a measurement (runner kernel, not the target)
        run: |
          sudo mkdir -p /var/tmp/p15-os && echo x | sudo tee /var/tmp/p15-os/same > /dev/null
          sudo build/open_sections single 2 20000 /var/tmp/p15-os > build/open_sections.txt || { cat build/open_sections.txt; exit 1; }
          python3 bench/open_sections/summarize.py build/open_sections.txt > /dev/null
          sudo build/open_sections contend 6 20000 /var/tmp/p15-os > build/open_contend.txt || { cat build/open_contend.txt; exit 1; }
          python3 bench/open_sections/summarize.py build/open_contend.txt
      - name: Soak harness (gate 4), 45 s of real programs; every operation they logged must be in the WAL and the graph (runner kernel, not the target)
        run: |
          sudo "$(command -v python3)" bench/soak/soak.py --p15d build/p15d --work /var/tmp/p15-soak --duration 45 --sample 15 \
               --settle 3 --clean > build/soak.txt || { cat build/soak.txt; exit 1; }
          python3 bench/soak/summarize.py build/soak.txt || { cat build/soak.txt; exit 1; }
      - name: Idle-cost harness (gate 3) runs p15d in two poll settings and their runs end clean; not a measurement (runner kernel, not the target)
        run: |
          sudo "$(command -v python3)" bench/idle_cost/run.py --p15d build/p15d --work /var/tmp/p15-idle --rounds 1 --settle 2 --window 5 \
               --arm max10=--poll-max-ms=10 --arm max200=--poll-max-ms=200 > build/idle_cost.txt || { cat build/idle_cost.txt; exit 1; }
          python3 bench/idle_cost/summarize.py build/idle_cost.txt
      - name: Path-walk harness (gate 2) loads, and its walk matches bpf_d_path or says why in every case and the rename race; the times are not a measurement (runner kernel, not the target)
        run: |
          sudo build/path_walk /var/tmp/p15-pw 2 2000 > build/path_walk.txt || { cat build/path_walk.txt; exit 1; }
          python3 bench/path_walk/summarize.py build/path_walk.txt
      - name: Hook-cost harness (ADR-0020 confirmation 5) loads every arm and its books close; not a measurement (runner kernel, not the target)
        run: sudo build/hook_cost build/spine.bpf.o 2 2000 20 > build/hook_cost.txt && tail -1 build/hook_cost.txt && python3 bench/hook_cost/summarize.py build/hook_cost.txt > /dev/null
      - name: Read-path hook-cost harness (decision 1a, N5) loads every arm, kprobe.session beside fentry, books close; not a measurement (runner kernel, not the target)
        run: |
          sudo build/rw_hook_cost 2 2000 200 > build/rw_hook_cost.txt || { grep -v '^row ' build/rw_hook_cost.txt; exit 1; }
          grep -v '^row ' build/rw_hook_cost.txt
          python3 bench/rw_hook_cost/summarize.py build/rw_hook_cost.txt > /dev/null
